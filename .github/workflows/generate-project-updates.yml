name: Generate Project Updates listings
# Refreshes the committed copy of the Project Updates nav in mkdocs.yml and
# the year index pages after a report merges. The published site does not
# depend on this: the Documentation workflow regenerates both on every build.
on:
  push:
    branches:
      - main
    paths:
      - tac/project-updates/**
      - scripts/generate-project-updates.py
      - mkdocs.yml
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: generate-project-updates
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    steps:
      - name: Checkout the governance repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate the Project Updates listings
        run: python3 scripts/generate-project-updates.py

      # does nothing when the listings were already up to date
      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: project-updates/regenerate
          add-paths: |
            mkdocs.yml
            tac/project-updates/*/index.md
          commit-message: 'Regenerate Project Updates listings'
          signoff: true
          title: 'Regenerate Project Updates listings'
          body: |
            Regenerated by the [Generate Project Updates listings workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            from `scripts/generate-project-updates.py`.

            These listings are generated from the report files in `tac/project-updates/<year>/`. Rerun the workflow rather than editing them by hand.
          delete-branch: true
